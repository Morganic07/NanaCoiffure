<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prendre RDV - Phoenix Royal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 16px;
            opacity: 0.95;
            line-height: 1.5;
        }

        .content {
            padding: 40px 30px;
        }

        .cta-section {
            text-align: center;
            padding: 30px 0;
        }

        .cta-section h2 {
            font-size: 28px;
            color: #333;
            margin-bottom: 15px;
        }

        .cta-section p {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .btn-calendly {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-calendly:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn-calendly:active {
            transform: translateY(0);
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #666;
            font-size: 14px;
            border-top: 1px solid #e0e0e0;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .content {
                padding: 25px 20px;
            }

            .btn-calendly {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Phoenix Royal</h1>
            <p>Prenez rendez-vous facilement</p>
        </div>

        <div class="content">
            <div class="cta-section">
                <h2>Réservez votre créneau</h2>
                <p>Cliquez sur le bouton ci-dessous pour choisir un rendez-vous</p>
                <button class="btn-calendly" onclick="Calendly.initPopupWidget({url: 'https://calendly.com/phoenixroyal78'}); return false;">
                    Prendre RDV maintenant
                </button>
            </div>
        </div>

        <div class="footer">
            <p>© 2026 Phoenix Royal. Tous droits réservés.</p>
        </div>
    </div>

    <script src="https://assets.calendly.com/assets/external/widget.js"></script>
</body>
</html>
